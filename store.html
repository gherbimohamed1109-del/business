<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتجر</title>
<style>
:root{--bg:#f4f5fa;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--pri:#4f46e5;--bd:#e5e7eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--tx:#eef0f6;--mut:#9aa1b2;--pri:#818cf8;--bd:#2a2f3c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,Arial,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px 16px 40px}h2{text-align:center}
.c{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.p{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.p:last-child{border:0}
.p img{width:60px;height:60px;border-radius:10px;object-fit:cover}.p div{flex:1}.p small{color:var(--mut);display:block}
.q{display:flex;align-items:center;gap:8px}.q button{width:34px;height:34px;padding:0;font-size:18px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;margin-bottom:8px}
button{font:inherit;border:0;border-radius:10px;padding:12px;background:var(--pri);color:#fff;cursor:pointer}
.go{width:100%}p{color:var(--mut)}
</style>
</head>
<body>
<div class="w"><h2 id="t">المتجر</h2><div class="c" id="ps"><p>جارٍ التحميل...</p></div><div class="c" id="ct" style="display:none"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,getDocs,addDoc,collection,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const db=getFirestore(initializeApp(firebaseConfig));
const s=new URLSearchParams(location.search).get("s"),$=i=>document.getElementById(i);
const esc=t=>{const d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML};
let P=[],C={},store={};
const total=()=>P.reduce((a,p)=>a+p.p*(C[p.id]||0),0),count=()=>Object.values(C).reduce((a,b)=>a+b,0);
function draw(){
 $("ps").innerHTML=P.length?P.map(p=>'<div class="p">'+(/^https?:\/\//.test(p.img||"")?'<img src="'+esc(p.img)+'">':"")+'<div><b>'+esc(p.n)+'</b><small>'+p.p+'</small></div><div class="q"><button onclick="ch(\''+p.id+'\',-1)">−</button><b>'+(C[p.id]||0)+'</b><button onclick="ch(\''+p.id+'\',1)">+</button></div></div>').join(""):"<p>لا توجد منتجات حالياً</p>";
 const ct=$("ct");if(!count()){ct.style.display="none";return}
 if(!ct.dataset.f){ct.dataset.f=1;ct.innerHTML='<h3>إتمام الطلب</h3><p id="sm"></p><input id="n" placeholder="الاسم" maxlength="100"><input id="ph" type="tel" placeholder="رقم الهاتف" maxlength="30"><textarea id="ad" rows="2" placeholder="العنوان" maxlength="300"></textarea><button class="go" onclick="send()">إرسال الطلب</button><p id="m"></p>'}
 ct.style.display="block";$("sm").textContent="الإجمالي: "+total()+" ("+count()+" قطعة)";
}
window.ch=(id,d)=>{C[id]=Math.max(0,Math.min(99,(C[id]||0)+d));draw()};
window.send=async()=>{
 const n=$("n").value.trim(),ph=$("ph").value.trim();if(!n||!ph){$("m").textContent="أكمل الاسم والهاتف";return}
 const items=P.filter(p=>C[p.id]).map(p=>p.n+" × "+C[p.id]);
 const product=(items.join("، ")+" | المجموع: "+total()).slice(0,200);
 try{
  await addDoc(collection(db,"users",s,"orders"),{name:n,phone:ph,product,qty:count(),address:$("ad").value.trim(),pc:total(),status:"new",ts:serverTimestamp()});
  const wa=store.wa?'<a href="https://wa.me/'+store.wa+'?text='+encodeURIComponent("مرحبا، أنا "+n+" وقد أرسلت طلباً: "+product)+'" style="display:block;margin-top:14px;padding:13px;border-radius:12px;background:#25D366;color:#fff;text-decoration:none;text-align:center">💬 تواصل معنا عبر واتساب</a>':"";
  document.querySelector(".w").innerHTML='<div class="c" style="text-align:center;margin-top:8vh"><div style="font-size:48px">✅</div><h2>تم إرسال طلبك</h2><p>سنتواصل معك قريباً</p>'+wa+'</div>';
 }catch(e){$("m").textContent="تعذر الإرسال، حاول مرة أخرى"}
};
if(!s){$("ps").innerHTML="<p>رابط غير صحيح</p>"}
else{
 getDoc(doc(db,"stores",s)).then(d=>{if(d.exists()){store=d.data();$("t").textContent=store.name}}).catch(()=>{});
 getDocs(query(collection(db,"users",s,"products"),orderBy("ts","desc"))).then(q=>{P=q.docs.map(x=>({id:x.id,...x.data()}));draw()}).catch(()=>{$("ps").innerHTML="<p>تعذر تحميل المنتجات</p>"});
}
</script>
</body>
</html>
